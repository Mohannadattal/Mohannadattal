<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Mohannad Attal — Fullstack Software Developer</title>
  <desc id="description">A dark architectural banner connecting backend, API, and frontend layers.</desc>

  <defs>
